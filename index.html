<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DIY Experiences LLP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 900px;
    }

    h2 {
      font-size: clamp(22px, 4vw, 40px);
      font-weight: 400;
      margin-bottom: 22px;
      line-height: 1.3;
    }

    h1 {
      font-size: clamp(42px, 8vw, 88px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 45px;
    }

    p {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 10px;
    }

    a {
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      border-bottom: 1px solid #fff;
      padding-bottom: 4px;
    }

    a:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Something new is coming to Hyderabad.</h2>

    <h1>DIY Experiences LLP</h1>

    <p>Get in touch</p>

    <a href="mailto:hello@diyexperiences.in">
      hello@diyexperiences.in
    </a>

  </div>

</body>
</html>
